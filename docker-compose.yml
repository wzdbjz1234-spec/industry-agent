services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quality_case}
      POSTGRES_USER: ${POSTGRES_USER:-quality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quality-local-only}
    ports:
      - "5432:5432"
    volumes:
      - quality-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quality} -d ${POSTGRES_DB:-quality_case}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - quality-minio:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      QUALITY_RUNTIME_MODE: ${QUALITY_RUNTIME_MODE:-demo}
      QUALITY_QMS_MODE: ${QUALITY_QMS_MODE:-SHADOW}
      QUALITY_QMS_BASE_URL: ${QUALITY_QMS_BASE_URL:-}
      QUALITY_OIDC_USERINFO_URL: ${QUALITY_OIDC_USERINFO_URL:-}
      QUALITY_DATABASE_URL: ${QUALITY_DATABASE_URL:-postgresql+psycopg://quality:quality-local-only@postgres:5432/quality_case}
      QUALITY_REDIS_URL: ${QUALITY_REDIS_URL:-redis://redis:6379/0}
      QUALITY_MINIO_ENDPOINT: ${QUALITY_MINIO_ENDPOINT:-minio:9000}
      QUALITY_MINIO_BUCKET: ${QUALITY_MINIO_BUCKET:-quality-case}
      QUALITY_LLM_PROVIDER: ${QUALITY_LLM_PROVIDER:-deterministic}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QUALITY_LLM_BASE_URL: ${QUALITY_LLM_BASE_URL:-https://api.deepseek.com}
      QUALITY_LLM_MODEL: ${QUALITY_LLM_MODEL:-deepseek-v4-flash}
      QUALITY_LLM_TIMEOUT_S: ${QUALITY_LLM_TIMEOUT_S:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  quality-postgres:
  quality-minio:
