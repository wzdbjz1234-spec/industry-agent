name: quality-case-agent-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --dev
      - run: uv run ruff check backend/src backend/tests simulator scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/generate_schemas.py
      - run: uv run python scripts/verify_package_structure.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

